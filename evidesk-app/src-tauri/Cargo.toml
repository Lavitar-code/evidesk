[package]
name = "evidesk_app"
version = "0.1.0"
description = "Evidesk desktop app"
authors = ["you"]
edition = "2021"

[lib]
name = "evidesk_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
ulid = "1"
dirs = "5"
thiserror = "1"
tauri-plugin-dialog = "2"
